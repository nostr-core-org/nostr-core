<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0f1319"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#FFCA4A"/>
      <stop offset="100%" stop-color="#897FFF"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="emblemGlow" cx="893" cy="305" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#897FFF" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Ambient glow -->
  <ellipse cx="893" cy="305" rx="330" ry="290" fill="url(#emblemGlow)"/>

  <!-- Terminal chrome -->
  <rect width="1200" height="38" rx="10" fill="#161b22"/>
  <rect y="28" width="1200" height="10" fill="#161b22"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>

  <!-- Faint grid lines -->
  <line x1="620" y1="80" x2="620" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="780" y1="80" x2="780" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="940" y1="80" x2="940" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="1100" y1="80" x2="1100" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="160" x2="1160" y2="160" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="315" x2="1160" y2="315" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="470" x2="1160" y2="470" stroke="#1c2128" stroke-width="1"/>

  <!-- Title (left side) -->
  <text x="60" y="110" font-size="14" fill="#f97316" font-weight="bold">18</text>
  <text x="60" y="172" font-size="38" fill="#c9d1d9" font-weight="bold">Mail, minus</text>
  <text x="60" y="222" font-size="38" fill="#f97316" font-weight="bold">the mail server</text>
  <text x="60" y="292" font-size="16" fill="#8b949e">To, Cc, and a Bcc that stays</text>
  <text x="60" y="317" font-size="16" fill="#8b949e">blind by construction.</text>
  <text x="60" y="342" font-size="16" fill="#8b949e">Email-shaped, over gift wrap.</text>

  <!-- Badges -->
  <rect x="60" y="386" width="112" height="28" rx="6" fill="#0d1117" stroke="#f97316" stroke-width="1"/>
  <text x="116" y="405" text-anchor="middle" font-size="11" fill="#f97316" font-weight="bold">To / Cc / Bcc</text>

  <rect x="182" y="386" width="100" height="28" rx="6" fill="#0d1117" stroke="#897FFF" stroke-width="1"/>
  <text x="232" y="405" text-anchor="middle" font-size="11" fill="#897FFF" font-weight="bold">kind 1059</text>

  <rect x="292" y="386" width="96" height="28" rx="6" fill="#0d1117" stroke="#FFCA4A" stroke-width="1"/>
  <text x="340" y="405" text-anchor="middle" font-size="11" fill="#FFCA4A" font-weight="bold">AES-256</text>

  <!-- Import hint -->
  <text x="60" y="462" font-size="12" fill="#484f58">import { mail } from 'nostr-core'</text>

  <!-- === NESTED ENVELOPE EMBLEM (right side) === -->
  <circle cx="893" cy="305" r="172" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-opacity="0.28" filter="url(#bigGlow)"/>
  <circle cx="893" cy="305" r="160" fill="none" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="893" cy="305" r="155" fill="none" stroke="#30363d" stroke-width="0.5"/>

  <!-- Outer envelope: the gift wrap, all a relay sees -->
  <g transform="translate(793, 232)">
    <rect x="0" y="0" width="200" height="132" rx="12" fill="#0d1117" stroke="#897FFF" stroke-width="3" filter="url(#softGlow)"/>
    <path d="M 6 12 L 100 78 L 194 12" stroke="#897FFF" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="100" y="122" text-anchor="middle" font-size="10" fill="#897FFF">kind 1059 · anonymous</text>
  </g>

  <!-- Inner letter peeking out: the sealed mail -->
  <g transform="translate(838, 196)">
    <rect x="0" y="0" width="110" height="70" rx="8" fill="url(#cardEdge)" stroke="#FFCA4A" stroke-width="2" filter="url(#softGlow)"/>
    <line x1="12" y1="18" x2="72" y2="18" stroke="#FFCA4A" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="32" x2="94" y2="32" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="44" x2="86" y2="44" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="56" x2="60" y2="56" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
    <!-- wax-seal dot -->
    <circle cx="92" cy="54" r="9" fill="#0d1117" stroke="#f97316" stroke-width="2"/>
    <circle cx="92" cy="54" r="3.5" fill="#f97316"/>
  </g>

  <!-- Recipients row -->
  <g transform="translate(808, 398)">
    <!-- to -->
    <circle cx="20" cy="14" r="13" fill="#161b22" stroke="#f97316" stroke-width="2"/>
    <circle cx="20" cy="10" r="4" fill="#f97316"/>
    <path d="M 12 20 a 8 6 0 0 1 16 0" fill="#f97316"/>
    <text x="20" y="46" text-anchor="middle" font-size="10" fill="#f97316">to</text>
    <!-- cc -->
    <circle cx="85" cy="14" r="13" fill="#161b22" stroke="#FFCA4A" stroke-width="2"/>
    <circle cx="85" cy="10" r="4" fill="#FFCA4A"/>
    <path d="M 77 20 a 8 6 0 0 1 16 0" fill="#FFCA4A"/>
    <text x="85" y="46" text-anchor="middle" font-size="10" fill="#FFCA4A">cc</text>
    <!-- bcc: dashed ring, invisible to the others -->
    <circle cx="150" cy="14" r="13" fill="#161b22" stroke="#897FFF" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="150" cy="10" r="4" fill="#897FFF" opacity="0.6"/>
    <path d="M 142 20 a 8 6 0 0 1 16 0" fill="#897FFF" opacity="0.6"/>
    <text x="150" y="46" text-anchor="middle" font-size="10" fill="#897FFF">bcc</text>
  </g>

  <!-- Watermark -->
  <text x="1160" y="595" text-anchor="end" font-size="11" fill="#30363d">nostr-core</text>

  <!-- Bottom accent bar -->
  <rect y="626" width="400" height="4" fill="#f97316"/>
  <rect x="400" y="626" width="400" height="4" fill="#FFCA4A"/>
  <rect x="800" y="626" width="400" height="4" fill="#897FFF"/>
</svg>
