<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0f1319"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#FFCA4A"/>
      <stop offset="100%" stop-color="#897FFF"/>
    </linearGradient>
    <linearGradient id="shieldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCA4A"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="emblemGlow" cx="893" cy="305" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#897FFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Ambient glow -->
  <ellipse cx="893" cy="305" rx="330" ry="290" fill="url(#emblemGlow)"/>

  <!-- Terminal chrome -->
  <rect width="1200" height="38" rx="10" fill="#161b22"/>
  <rect y="28" width="1200" height="10" fill="#161b22"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>

  <!-- Faint grid lines -->
  <line x1="620" y1="80" x2="620" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="780" y1="80" x2="780" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="940" y1="80" x2="940" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="1100" y1="80" x2="1100" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="160" x2="1160" y2="160" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="315" x2="1160" y2="315" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="470" x2="1160" y2="470" stroke="#1c2128" stroke-width="1"/>

  <!-- Title (left side) -->
  <text x="60" y="110" font-size="14" fill="#f97316" font-weight="bold">20</text>
  <text x="60" y="172" font-size="38" fill="#c9d1d9" font-weight="bold">Validate before</text>
  <text x="60" y="222" font-size="38" fill="#f97316" font-weight="bold">you trust</text>
  <text x="60" y="292" font-size="16" fill="#8b949e">TypeScript ends at compile time.</text>
  <text x="60" y="317" font-size="16" fill="#8b949e">Schema checks shape at the edges.</text>
  <text x="60" y="342" font-size="16" fill="#8b949e">Policy judges what gets through.</text>

  <!-- Badges -->
  <rect x="60" y="386" width="84" height="28" rx="6" fill="#0d1117" stroke="#f97316" stroke-width="1"/>
  <text x="102" y="405" text-anchor="middle" font-size="11" fill="#f97316" font-weight="bold">schema</text>

  <rect x="154" y="386" width="78" height="28" rx="6" fill="#0d1117" stroke="#FFCA4A" stroke-width="1"/>
  <text x="193" y="405" text-anchor="middle" font-size="11" fill="#FFCA4A" font-weight="bold">policy</text>

  <rect x="242" y="386" width="78" height="28" rx="6" fill="#0d1117" stroke="#897FFF" stroke-width="1"/>
  <text x="281" y="405" text-anchor="middle" font-size="11" fill="#897FFF" font-weight="bold">pipe()</text>

  <!-- Import hint -->
  <text x="60" y="462" font-size="12" fill="#484f58">import { schema, policy } from 'nostr-core'</text>

  <!-- === SHIELD EMBLEM (right side) === -->
  <circle cx="893" cy="305" r="172" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-opacity="0.28" filter="url(#bigGlow)"/>
  <circle cx="893" cy="305" r="160" fill="none" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="893" cy="305" r="155" fill="none" stroke="#30363d" stroke-width="0.5"/>

  <!-- Flow line -->
  <line x1="750" y1="305" x2="1036" y2="305" stroke="#30363d" stroke-width="2"/>

  <!-- Incoming dots -->
  <circle cx="768" cy="305" r="7" fill="#897FFF"/>
  <circle cx="796" cy="305" r="7" fill="#FFCA4A"/>
  <circle cx="824" cy="305" r="7" fill="#f97316"/>

  <!-- Shield -->
  <g filter="url(#softGlow)">
    <path d="M 893 212 L 957 240 V 318 Q 957 378 893 406 Q 829 378 829 318 V 240 Z"
          fill="#0d1117" stroke="url(#shieldFace)" stroke-width="6"/>
    <path d="M 867 306 l 19 20 l 34 -42" stroke="#27c93f" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Accepted dots -->
  <circle cx="984" cy="305" r="7" fill="#27c93f" filter="url(#softGlow)"/>
  <circle cx="1014" cy="305" r="7" fill="#27c93f" opacity="0.6"/>

  <!-- One rejected dot -->
  <circle cx="806" cy="222" r="7" fill="none" stroke="#ff5f56" stroke-width="2.5"/>
  <path d="M 802 218 l 8 8 M 810 218 l -8 8" stroke="#ff5f56" stroke-width="2" stroke-linecap="round"/>

  <!-- Watermark -->
  <text x="1160" y="595" text-anchor="end" font-size="11" fill="#30363d">nostr-core</text>

  <!-- Bottom accent bar -->
  <rect y="626" width="400" height="4" fill="#f97316"/>
  <rect x="400" y="626" width="400" height="4" fill="#FFCA4A"/>
  <rect x="800" y="626" width="400" height="4" fill="#897FFF"/>
</svg>
