<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0f1319"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#FFCA4A"/>
      <stop offset="100%" stop-color="#897FFF"/>
    </linearGradient>
    <linearGradient id="deviceEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d333b"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>
    <linearGradient id="syncStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#FFCA4A"/>
      <stop offset="100%" stop-color="#897FFF"/>
    </linearGradient>
    <radialGradient id="emblemGlow" cx="893" cy="305" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFCA4A" stop-opacity="0.13"/>
      <stop offset="60%" stop-color="#897FFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- The settings panel, defined ONCE and stamped on every device,
         so the synced state is pixel-identical by construction. -->
    <g id="prefsPanel">
      <!-- title bar -->
      <rect x="0" y="0" width="36" height="6" rx="3" fill="#897FFF"/>
      <!-- row 1: label + toggle, ON -->
      <rect x="0" y="16" width="20" height="5" rx="2.5" fill="#30363d"/>
      <rect x="30" y="12" width="22" height="12" rx="6" fill="#27c93f"/>
      <circle cx="46" cy="18" r="4" fill="#0d1117"/>
      <!-- row 2: slider, knob at 70% -->
      <rect x="0" y="34" width="52" height="4" rx="2" fill="#30363d"/>
      <rect x="0" y="34" width="36" height="4" rx="2" fill="#f97316"/>
      <circle cx="36" cy="36" r="5" fill="#FFCA4A" stroke="#0d1117" stroke-width="1.5"/>
      <!-- row 3: segmented control, middle selected -->
      <rect x="0" y="48" width="16" height="11" rx="3" fill="#21262d"/>
      <rect x="18" y="48" width="16" height="11" rx="3" fill="#897FFF"/>
      <rect x="36" y="48" width="16" height="11" rx="3" fill="#21262d"/>
    </g>
  </defs>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Ambient glow -->
  <ellipse cx="893" cy="305" rx="330" ry="290" fill="url(#emblemGlow)"/>

  <!-- Terminal chrome -->
  <rect width="1200" height="38" rx="10" fill="#161b22"/>
  <rect y="28" width="1200" height="10" fill="#161b22"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>

  <!-- Faint grid lines -->
  <line x1="620" y1="80" x2="620" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="780" y1="80" x2="780" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="940" y1="80" x2="940" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="1100" y1="80" x2="1100" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="160" x2="1160" y2="160" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="315" x2="1160" y2="315" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="470" x2="1160" y2="470" stroke="#1c2128" stroke-width="1"/>
  <!-- crosshair ticks at two intersections -->
  <path d="M 775 160 h 10 M 780 155 v 10" stroke="#21262d" stroke-width="1"/>
  <path d="M 1095 470 h 10 M 1100 465 v 10" stroke="#21262d" stroke-width="1"/>

  <!-- Title (left side) -->
  <text x="60" y="110" font-size="14" fill="#f97316" font-weight="bold">19</text>
  <text x="60" y="172" font-size="38" fill="#c9d1d9" font-weight="bold">Settings that</text>
  <text x="60" y="222" font-size="38" fill="#f97316" font-weight="bold">follow your keys</text>
  <text x="60" y="292" font-size="16" fill="#8b949e">Relays as a personal database.</text>
  <text x="60" y="317" font-size="16" fill="#8b949e">Preferences on every device.</text>
  <text x="60" y="342" font-size="16" fill="#8b949e">No account system.</text>

  <!-- Badges -->
  <rect x="60" y="386" width="106" height="28" rx="6" fill="#0d1117" stroke="#f97316" stroke-width="1"/>
  <text x="113" y="405" text-anchor="middle" font-size="11" fill="#f97316" font-weight="bold">kind 30078</text>

  <rect x="176" y="386" width="80" height="28" rx="6" fill="#0d1117" stroke="#897FFF" stroke-width="1"/>
  <text x="216" y="405" text-anchor="middle" font-size="11" fill="#897FFF" font-weight="bold">NIP-44</text>

  <rect x="266" y="386" width="70" height="28" rx="6" fill="#0d1117" stroke="#FFCA4A" stroke-width="1"/>
  <text x="301" y="405" text-anchor="middle" font-size="11" fill="#FFCA4A" font-weight="bold">d tag</text>

  <!-- Import hint -->
  <text x="60" y="462" font-size="12" fill="#484f58">import { nip78 } from 'nostr-core'</text>

  <!-- === SYNC EMBLEM (right side) === -->
  <circle cx="893" cy="305" r="172" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-opacity="0.28" filter="url(#bigGlow)"/>
  <circle cx="893" cy="305" r="160" fill="none" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="893" cy="305" r="155" fill="none" stroke="#30363d" stroke-width="0.5"/>

  <!-- Sync path: phone -> relay -> monitor, one continuous arc -->
  <path d="M 794 246 C 810 176, 976 176, 996 250"
        stroke="url(#syncStroke)" stroke-width="2.5" stroke-dasharray="7 6"
        stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- arrowheads, both directions -->
  <path d="M 794 246 l 10 -12 M 794 246 l 14 -3" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 996 250 l -10 -13 M 996 250 l -14 -3" stroke="#897FFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Relay node, sitting on the apex of the path -->
  <g transform="translate(893, 196)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="25" fill="#0d1117" stroke="#f97316" stroke-width="3"/>
    <circle cx="0" cy="3" r="4" fill="#f97316"/>
    <path d="M -11 -1 a 11 11 0 0 1 22 0" stroke="#f97316" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M -17 3 a 17 17 0 0 1 34 0" stroke="#f97316" stroke-width="1.8" fill="none" stroke-opacity="0.55" stroke-linecap="round"/>
  </g>

  <!-- Key charm riding the sync path -->
  <g transform="translate(824, 210) rotate(-24)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="7" fill="none" stroke="#FFCA4A" stroke-width="3"/>
    <line x1="6" y1="3" x2="22" y2="11" stroke="#FFCA4A" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="8" x2="13" y2="14" stroke="#FFCA4A" stroke-width="3" stroke-linecap="round"/>
    <line x1="21" y1="11" x2="19" y2="17" stroke="#FFCA4A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Phone (left), one stamp of the shared panel -->
  <g>
    <rect x="760" y="250" width="68" height="126" rx="14" fill="url(#deviceEdge)" stroke="#30363d" stroke-width="1.5" filter="url(#softGlow)"/>
    <rect x="766" y="262" width="56" height="96" rx="6" fill="#0d1117"/>
    <rect x="782" y="254" width="24" height="4" rx="2" fill="#30363d"/>
    <use href="#prefsPanel" x="768" y="272"/>
    <rect x="782" y="366" width="24" height="4" rx="2" fill="#30363d"/>
  </g>

  <!-- Monitor (right), same panel, same state, by construction -->
  <g>
    <rect x="946" y="254" width="108" height="90" rx="10" fill="url(#deviceEdge)" stroke="#30363d" stroke-width="1.5" filter="url(#softGlow)"/>
    <rect x="953" y="261" width="94" height="76" rx="5" fill="#0d1117"/>
    <use href="#prefsPanel" x="974" y="269"/>
    <path d="M 988 344 h 24 l 5 14 h -34 z" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="972" y="358" width="56" height="5" rx="2.5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  </g>

  <!-- Equality mark between the two screens -->
  <g stroke="#27c93f" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)">
    <line x1="878" y1="300" x2="908" y2="300"/>
    <line x1="878" y1="312" x2="908" y2="312"/>
  </g>

  <!-- The document address, the one public thing -->
  <g transform="translate(893, 404)">
    <rect x="-77" y="-14" width="154" height="28" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="-60" cy="0" r="6" fill="none" stroke="#FFCA4A" stroke-width="2"/>
    <circle cx="-60" cy="0" r="1.8" fill="#FFCA4A"/>
    <text x="-46" y="4" font-size="11" fill="#8b949e">d: my-app/prefs</text>
  </g>
  <!-- newest wins note -->
  <text x="893" y="440" text-anchor="middle" font-size="10" fill="#484f58">one event · newest wins</text>

  <!-- Watermark -->
  <text x="1160" y="595" text-anchor="end" font-size="11" fill="#30363d">nostr-core</text>

  <!-- Bottom accent bar -->
  <rect y="626" width="400" height="4" fill="#f97316"/>
  <rect x="400" y="626" width="400" height="4" fill="#FFCA4A"/>
  <rect x="800" y="626" width="400" height="4" fill="#897FFF"/>
</svg>
