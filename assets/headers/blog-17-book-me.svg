<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0f1319"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#FFCA4A"/>
      <stop offset="100%" stop-color="#897FFF"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="emblemGlow" cx="893" cy="305" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#897FFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Ambient glow -->
  <ellipse cx="893" cy="305" rx="330" ry="290" fill="url(#emblemGlow)"/>

  <!-- Terminal chrome -->
  <rect width="1200" height="38" rx="10" fill="#161b22"/>
  <rect y="28" width="1200" height="10" fill="#161b22"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>

  <!-- Faint grid lines -->
  <line x1="620" y1="80" x2="620" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="780" y1="80" x2="780" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="940" y1="80" x2="940" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="1100" y1="80" x2="1100" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="160" x2="1160" y2="160" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="315" x2="1160" y2="315" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="470" x2="1160" y2="470" stroke="#1c2128" stroke-width="1"/>

  <!-- Title (left side) -->
  <text x="60" y="110" font-size="14" fill="#f97316" font-weight="bold">17</text>
  <text x="60" y="172" font-size="38" fill="#c9d1d9" font-weight="bold">Book me</text>
  <text x="60" y="222" font-size="38" fill="#f97316" font-weight="bold">on Nostr</text>
  <text x="60" y="292" font-size="16" fill="#8b949e">Availability as an event.</text>
  <text x="60" y="317" font-size="16" fill="#8b949e">Bookings as private invites.</text>
  <text x="60" y="342" font-size="16" fill="#8b949e">No subscription in between.</text>

  <!-- Badges -->
  <rect x="60" y="386" width="106" height="28" rx="6" fill="#0d1117" stroke="#f97316" stroke-width="1"/>
  <text x="113" y="405" text-anchor="middle" font-size="11" fill="#f97316" font-weight="bold">kind 31926</text>

  <rect x="176" y="386" width="80" height="28" rx="6" fill="#0d1117" stroke="#FFCA4A" stroke-width="1"/>
  <text x="216" y="405" text-anchor="middle" font-size="11" fill="#FFCA4A" font-weight="bold">NIP-52</text>

  <rect x="266" y="386" width="94" height="28" rx="6" fill="#0d1117" stroke="#897FFF" stroke-width="1"/>
  <text x="313" y="405" text-anchor="middle" font-size="11" fill="#897FFF" font-weight="bold">gift wrap</text>

  <!-- Import hint -->
  <text x="60" y="462" font-size="12" fill="#484f58">import { scheduling } from 'nostr-core'</text>

  <!-- === CALENDAR EMBLEM (right side) === -->
  <circle cx="893" cy="305" r="172" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-opacity="0.28" filter="url(#bigGlow)"/>
  <circle cx="893" cy="305" r="160" fill="none" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="893" cy="305" r="155" fill="none" stroke="#30363d" stroke-width="0.5"/>

  <!-- Calendar card -->
  <g transform="translate(800, 210)">
    <rect x="0" y="0" width="186" height="190" rx="12" fill="url(#cardEdge)" stroke="#30363d" stroke-width="1.5" filter="url(#softGlow)"/>
    <rect x="0" y="0" width="186" height="40" rx="12" fill="#161b22"/>
    <rect x="0" y="26" width="186" height="14" fill="#161b22"/>
    <circle cx="46" cy="8" r="5" fill="#0d1117" stroke="#f97316" stroke-width="2"/>
    <circle cx="140" cy="8" r="5" fill="#0d1117" stroke="#f97316" stroke-width="2"/>
    <text x="93" y="27" text-anchor="middle" font-size="13" fill="#c9d1d9" font-weight="bold">intro-call</text>

    <!-- Slot grid: 3 columns x 3 rows -->
    <g>
      <rect x="14" y="54" width="48" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
      <rect x="69" y="54" width="48" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
      <rect x="124" y="54" width="48" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>

      <rect x="14" y="92" width="48" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
      <!-- booked slot -->
      <rect x="69" y="92" width="48" height="30" rx="6" fill="#f97316" filter="url(#softGlow)"/>
      <path d="M 84 107 l 5 5 l 9 -11" stroke="#0d1117" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="124" y="92" width="48" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>

      <rect x="14" y="130" width="48" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
      <rect x="69" y="130" width="48" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
      <!-- blocked / busy slot -->
      <rect x="124" y="130" width="48" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-dasharray="4 4"/>
    </g>
    <text x="93" y="180" text-anchor="middle" font-size="10" fill="#484f58">Mon 09:00 Europe/Berlin</text>
  </g>

  <!-- Clock badge: wall-clock rules, DST-safe -->
  <g transform="translate(1000, 218)">
    <circle cx="0" cy="0" r="32" fill="#161b22" stroke="#FFCA4A" stroke-width="2.5" filter="url(#softGlow)"/>
    <line x1="0" y1="0" x2="0" y2="-17" stroke="#FFCA4A" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="11" y2="6" stroke="#FFCA4A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#FFCA4A"/>
  </g>

  <!-- Sealed booking envelope: the private request -->
  <g transform="translate(966, 372)">
    <rect x="0" y="0" width="96" height="62" rx="8" fill="#0d1117" stroke="#897FFF" stroke-width="2" filter="url(#softGlow)"/>
    <path d="M 4 8 L 48 38 L 92 8" stroke="#897FFF" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <text x="48" y="54" text-anchor="middle" font-size="9" fill="#897FFF">kind 1059</text>
  </g>

  <!-- Watermark -->
  <text x="1160" y="595" text-anchor="end" font-size="11" fill="#30363d">nostr-core</text>

  <!-- Bottom accent bar -->
  <rect y="626" width="400" height="4" fill="#f97316"/>
  <rect x="400" y="626" width="400" height="4" fill="#FFCA4A"/>
  <rect x="800" y="626" width="400" height="4" fill="#897FFF"/>
</svg>
