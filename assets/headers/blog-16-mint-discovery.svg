<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0f1319"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#FFCA4A"/>
      <stop offset="100%" stop-color="#897FFF"/>
    </linearGradient>
    <linearGradient id="mintFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFCA4A"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="emblemGlow" cx="893" cy="305" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFCA4A" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#897FFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Ambient glow -->
  <ellipse cx="893" cy="305" rx="330" ry="290" fill="url(#emblemGlow)"/>

  <!-- Terminal chrome -->
  <rect width="1200" height="38" rx="10" fill="#161b22"/>
  <rect y="28" width="1200" height="10" fill="#161b22"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>

  <!-- Faint grid lines -->
  <line x1="620" y1="80" x2="620" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="780" y1="80" x2="780" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="940" y1="80" x2="940" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="1100" y1="80" x2="1100" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="160" x2="1160" y2="160" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="315" x2="1160" y2="315" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="470" x2="1160" y2="470" stroke="#1c2128" stroke-width="1"/>

  <!-- Title (left side) -->
  <text x="60" y="110" font-size="14" fill="#f97316" font-weight="bold">16</text>
  <text x="60" y="172" font-size="38" fill="#c9d1d9" font-weight="bold">Mints your</text>
  <text x="60" y="222" font-size="38" fill="#f97316" font-weight="bold">friends trust</text>
  <text x="60" y="292" font-size="16" fill="#8b949e">Your follows already know</text>
  <text x="60" y="317" font-size="16" fill="#8b949e">which mints are good.</text>
  <text x="60" y="342" font-size="16" fill="#8b949e">NIP-87 lets you ask them.</text>

  <!-- Badges -->
  <rect x="60" y="386" width="106" height="28" rx="6" fill="#0d1117" stroke="#f97316" stroke-width="1"/>
  <text x="113" y="405" text-anchor="middle" font-size="11" fill="#f97316" font-weight="bold">kind 38000</text>

  <rect x="176" y="386" width="76" height="28" rx="6" fill="#0d1117" stroke="#FFCA4A" stroke-width="1"/>
  <text x="214" y="405" text-anchor="middle" font-size="11" fill="#FFCA4A" font-weight="bold">38172</text>

  <rect x="262" y="386" width="76" height="28" rx="6" fill="#0d1117" stroke="#897FFF" stroke-width="1"/>
  <text x="300" y="405" text-anchor="middle" font-size="11" fill="#897FFF" font-weight="bold">38173</text>

  <!-- Import hint -->
  <text x="60" y="462" font-size="12" fill="#484f58">import { nip87 } from 'nostr-core'</text>

  <!-- === WEB OF TRUST EMBLEM (right side) === -->
  <circle cx="893" cy="305" r="172" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-opacity="0.28" filter="url(#bigGlow)"/>
  <circle cx="893" cy="305" r="160" fill="none" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="893" cy="305" r="155" fill="none" stroke="#30363d" stroke-width="0.5"/>

  <!-- Vouch lines from people to the mint -->
  <g stroke-linecap="round">
    <line x1="795" y1="205" x2="870" y2="282" stroke="#FFCA4A" stroke-width="2.5" stroke-opacity="0.85"/>
    <line x1="990" y1="212" x2="915" y2="284" stroke="#FFCA4A" stroke-width="2.5" stroke-opacity="0.85"/>
    <line x1="768" y1="345" x2="856" y2="315" stroke="#FFCA4A" stroke-width="2.5" stroke-opacity="0.85"/>
    <line x1="1012" y1="352" x2="928" y2="318" stroke="#897FFF" stroke-width="2" stroke-opacity="0.55"/>
    <line x1="880" y1="428" x2="890" y2="345" stroke="#30363d" stroke-width="2" stroke-dasharray="5 6"/>
  </g>

  <!-- People nodes -->
  <g>
    <circle cx="795" cy="205" r="17" fill="#161b22" stroke="#FFCA4A" stroke-width="2"/>
    <circle cx="795" cy="200" r="5" fill="#FFCA4A"/>
    <path d="M 785 213 a 10 7 0 0 1 20 0" fill="#FFCA4A"/>

    <circle cx="990" cy="212" r="17" fill="#161b22" stroke="#FFCA4A" stroke-width="2"/>
    <circle cx="990" cy="207" r="5" fill="#FFCA4A"/>
    <path d="M 980 220 a 10 7 0 0 1 20 0" fill="#FFCA4A"/>

    <circle cx="768" cy="345" r="17" fill="#161b22" stroke="#FFCA4A" stroke-width="2"/>
    <circle cx="768" cy="340" r="5" fill="#FFCA4A"/>
    <path d="M 758 353 a 10 7 0 0 1 20 0" fill="#FFCA4A"/>

    <circle cx="1012" cy="352" r="17" fill="#161b22" stroke="#897FFF" stroke-width="2"/>
    <circle cx="1012" cy="347" r="5" fill="#897FFF"/>
    <path d="M 1002 360 a 10 7 0 0 1 20 0" fill="#897FFF"/>

    <!-- unvouched stranger -->
    <circle cx="880" cy="428" r="17" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="880" cy="423" r="5" fill="#484f58"/>
    <path d="M 870 436 a 10 7 0 0 1 20 0" fill="#484f58"/>
  </g>

  <!-- Mint node (center): coin in a bank arch -->
  <g filter="url(#softGlow)">
    <circle cx="893" cy="305" r="46" fill="#0d1117" stroke="url(#mintFace)" stroke-width="4"/>
    <path d="M 875 316 v-14 h6 v14 z M 890 316 v-14 h6 v14 z M 905 316 v-14 h6 v14 z" fill="#FFCA4A"/>
    <path d="M 871 300 L 893 284 L 915 300 Z" fill="none" stroke="#FFCA4A" stroke-width="3" stroke-linejoin="round"/>
    <line x1="871" y1="320" x2="915" y2="320" stroke="#FFCA4A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tally chip -->
  <g transform="translate(940, 246)">
    <rect x="0" y="0" width="58" height="24" rx="12" fill="#0d1117" stroke="#27c93f" stroke-width="1.5"/>
    <path d="M 10 12 l 4 4 l 7 -8" stroke="#27c93f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="27" y="16" font-size="11" fill="#27c93f" font-weight="bold">x3</text>
  </g>

  <!-- Watermark -->
  <text x="1160" y="595" text-anchor="end" font-size="11" fill="#30363d">nostr-core</text>

  <!-- Bottom accent bar -->
  <rect y="626" width="400" height="4" fill="#f97316"/>
  <rect x="400" y="626" width="400" height="4" fill="#FFCA4A"/>
  <rect x="800" y="626" width="400" height="4" fill="#897FFF"/>
</svg>
