<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0f1319"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#FFCA4A"/>
      <stop offset="100%" stop-color="#897FFF"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="healed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27c93f"/>
      <stop offset="100%" stop-color="#27c93f"/>
    </linearGradient>
    <radialGradient id="emblemGlow" cx="893" cy="305" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#897FFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Ambient glow -->
  <ellipse cx="893" cy="305" rx="330" ry="290" fill="url(#emblemGlow)"/>

  <!-- Terminal chrome -->
  <rect width="1200" height="38" rx="10" fill="#161b22"/>
  <rect y="28" width="1200" height="10" fill="#161b22"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>

  <!-- Faint grid lines -->
  <line x1="620" y1="80" x2="620" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="780" y1="80" x2="780" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="940" y1="80" x2="940" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="1100" y1="80" x2="1100" y2="560" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="160" x2="1160" y2="160" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="315" x2="1160" y2="315" stroke="#1c2128" stroke-width="1"/>
  <line x1="620" y1="470" x2="1160" y2="470" stroke="#1c2128" stroke-width="1"/>
  <path d="M 775 160 h 10 M 780 155 v 10" stroke="#21262d" stroke-width="1"/>
  <path d="M 1095 470 h 10 M 1100 465 v 10" stroke="#21262d" stroke-width="1"/>

  <!-- Title (left side) -->
  <text x="60" y="110" font-size="14" fill="#f97316" font-weight="bold">21</text>
  <text x="60" y="172" font-size="38" fill="#c9d1d9" font-weight="bold">Connections that</text>
  <text x="60" y="222" font-size="38" fill="#f97316" font-weight="bold">heal themselves</text>
  <text x="60" y="292" font-size="16" fill="#8b949e">Laptops sleep. NATs time out.</text>
  <text x="60" y="317" font-size="16" fill="#8b949e">Your subscriptions no longer</text>
  <text x="60" y="342" font-size="16" fill="#8b949e">die with the socket.</text>

  <!-- Badges -->
  <rect x="60" y="386" width="88" height="28" rx="6" fill="#0d1117" stroke="#f97316" stroke-width="1"/>
  <text x="104" y="405" text-anchor="middle" font-size="11" fill="#f97316" font-weight="bold">backoff</text>

  <rect x="158" y="386" width="72" height="28" rx="6" fill="#0d1117" stroke="#FFCA4A" stroke-width="1"/>
  <text x="194" y="405" text-anchor="middle" font-size="11" fill="#FFCA4A" font-weight="bold">jitter</text>

  <rect x="240" y="386" width="80" height="28" rx="6" fill="#0d1117" stroke="#897FFF" stroke-width="1"/>
  <text x="280" y="405" text-anchor="middle" font-size="11" fill="#897FFF" font-weight="bold">replay</text>

  <!-- Import hint -->
  <text x="60" y="462" font-size="12" fill="#484f58">import { Relay } from 'nostr-core'</text>

  <!-- === THREE-LANE TIMELINE EMBLEM (right side) === -->
  <circle cx="893" cy="305" r="172" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-opacity="0.28" filter="url(#bigGlow)"/>
  <circle cx="893" cy="305" r="160" fill="none" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="893" cy="305" r="155" fill="none" stroke="#30363d" stroke-width="0.5"/>

  <!-- Client: a mini terminal window -->
  <g>
    <rect x="746" y="243" width="64" height="124" rx="10" fill="url(#cardEdge)" stroke="#30363d" stroke-width="1.5" filter="url(#softGlow)"/>
    <rect x="746" y="243" width="64" height="20" rx="10" fill="#161b22"/>
    <rect x="746" y="255" width="64" height="8" fill="#161b22"/>
    <circle cx="757" cy="253" r="3" fill="#ff5f56"/>
    <circle cx="768" cy="253" r="3" fill="#ffbd2e"/>
    <circle cx="779" cy="253" r="3" fill="#27c93f"/>
    <line x1="756" y1="278" x2="792" y2="278" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
    <line x1="756" y1="292" x2="800" y2="292" stroke="#21262d" stroke-width="3" stroke-linecap="round"/>
    <line x1="756" y1="306" x2="784" y2="306" stroke="#21262d" stroke-width="3" stroke-linecap="round"/>
    <line x1="756" y1="320" x2="796" y2="320" stroke="#21262d" stroke-width="3" stroke-linecap="round"/>
    <line x1="756" y1="334" x2="778" y2="334" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
    <rect x="756" y="348" width="8" height="10" fill="#f97316"/>
  </g>
  <text x="778" y="386" text-anchor="middle" font-size="10" fill="#8b949e">app</text>

  <!-- Relay: a full-height node card, so every lane lands on it -->
  <g>
    <rect x="990" y="243" width="60" height="124" rx="10" fill="url(#cardEdge)" stroke="#30363d" stroke-width="1.5" filter="url(#softGlow)"/>
    <g transform="translate(1020, 300)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="20" fill="#0d1117" stroke="#f97316" stroke-width="2.5"/>
      <circle cx="0" cy="3" r="3.5" fill="#f97316"/>
      <path d="M -9 0 a 9 9 0 0 1 18 0" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M -14 4 a 14 14 0 0 1 28 0" stroke="#f97316" stroke-width="1.5" fill="none" stroke-opacity="0.55" stroke-linecap="round"/>
    </g>
    <!-- lane sockets -->
    <circle cx="990" cy="252" r="3" fill="#30363d"/>
    <circle cx="990" cy="305" r="3" fill="#FFCA4A"/>
    <circle cx="990" cy="358" r="3" fill="#27c93f"/>
  </g>
  <text x="1020" y="386" text-anchor="middle" font-size="10" fill="#8b949e">relay</text>

  <!-- LANE 1: the drop -->
  <line x1="818" y1="252" x2="888" y2="252" stroke="#27c93f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 888 252 l 7 -6 M 888 252 l 7 6" stroke="#27c93f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 912 252 l -7 -6 M 912 252 l -7 6" stroke="#ff5f56" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="912" y1="252" x2="986" y2="252" stroke="#30363d" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/>
  <path d="M 896 246 l 8 12 M 904 246 l -8 12" stroke="#ff5f56" stroke-width="2" stroke-linecap="round"/>
  <text x="900" y="234" text-anchor="middle" font-size="10" fill="#ff5f56">drop</text>

  <!-- LANE 2: backoff retries, gaps doubling -->
  <g stroke="#f97316" stroke-linecap="round">
    <line x1="818" y1="305" x2="830" y2="305" stroke-width="3" stroke-opacity="0.45"/>
    <line x1="840" y1="305" x2="852" y2="305" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="872" y1="305" x2="884" y2="305" stroke-width="3" stroke-opacity="0.8"/>
    <line x1="924" y1="305" x2="936" y2="305" stroke-width="3"/>
  </g>
  <path d="M 936 305 h 46" stroke="#FFCA4A" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M 982 305 l -9 -6 M 982 305 l -9 6" stroke="#FFCA4A" stroke-width="2.5" stroke-linecap="round"/>
  <g font-size="9" fill="#484f58">
    <text x="824" y="322" text-anchor="middle">1s</text>
    <text x="846" y="322" text-anchor="middle">2s</text>
    <text x="878" y="322" text-anchor="middle">4s</text>
    <text x="930" y="322" text-anchor="middle" fill="#8b949e">8s</text>
  </g>

  <!-- LANE 3: healed, subscriptions replayed -->
  <line x1="818" y1="358" x2="986" y2="358" stroke="#27c93f" stroke-width="8" stroke-opacity="0.22" stroke-linecap="round"/>
  <line x1="818" y1="358" x2="986" y2="358" stroke="#27c93f" stroke-width="3.5" stroke-linecap="round"/>
  <g>
    <rect x="834" y="348" width="44" height="20" rx="10" fill="#0d1117" stroke="#897FFF" stroke-width="2"/>
    <text x="856" y="362" text-anchor="middle" font-size="9" fill="#897FFF" font-weight="bold">REQ 1</text>
    <rect x="896" y="348" width="44" height="20" rx="10" fill="#0d1117" stroke="#897FFF" stroke-width="2"/>
    <text x="918" y="362" text-anchor="middle" font-size="9" fill="#897FFF" font-weight="bold">REQ 2</text>
  </g>
  <circle cx="966" cy="358" r="9" fill="#0d1117" stroke="#27c93f" stroke-width="2"/>
  <path d="M 961.5 358 l 3.5 3.5 l 6 -7.5" stroke="#27c93f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="900" y="390" text-anchor="middle" font-size="10" fill="#484f58">subscriptions replayed</text>

  <!-- Watermark -->
  <text x="1160" y="595" text-anchor="end" font-size="11" fill="#30363d">nostr-core</text>

  <!-- Bottom accent bar -->
  <rect y="626" width="400" height="4" fill="#f97316"/>
  <rect x="400" y="626" width="400" height="4" fill="#FFCA4A"/>
  <rect x="800" y="626" width="400" height="4" fill="#897FFF"/>
</svg>
